spring.application.name=api-gateway
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-key-change-in-production-min-32-chars-long-xxx}

# Eureka Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Gateway Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=lb://payment-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/payments/**

spring.cloud.gateway.routes[3].id=document-service
spring.cloud.gateway.routes[3].uri=lb://document-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/documents/**

spring.cloud.gateway.routes[4].id=embedding-service
spring.cloud.gateway.routes[4].uri=lb://embedding-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/embeddings/**

spring.cloud.gateway.routes[5].id=chatbot-service
spring.cloud.gateway.routes[5].uri=lb://chatbot-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/chatbot/**

spring.cloud.gateway.routes[6].id=widget-api-service
spring.cloud.gateway.routes[6].uri=lb://widget-api-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/widget/**

# Logging
logging.level.root=INFO
logging.level.com.nsind=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

