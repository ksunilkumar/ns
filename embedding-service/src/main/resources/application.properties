spring.application.name=embedding-service
server.port=8084

# OpenAI Configuration
openai.api-key=${OPENAI_API_KEY:sk-test-key}
openai.api-url=${OPENAI_API_URL:https://api.openai.com/v1/embeddings}
openai.model=${OPENAI_MODEL:text-embedding-ada-002}

# Logging
logging.level.root=INFO
logging.level.com.nsind=DEBUG

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

