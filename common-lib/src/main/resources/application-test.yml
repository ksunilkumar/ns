spring:
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  h2:
    console:
      enabled: true

  redis:
    embedded: true

  elasticsearch:
    uris: http://localhost:9200

server:
  port: 8080

logging:
  level:
    root: INFO
    com.nsind: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Test properties
app:
  jwt:
    secret: test-secret-key-for-testing-only
    expiration: 3600000
  security:
    cors:
      allowed-origins: http://localhost:3000
  api:
    rate-limit:
      enabled: false

